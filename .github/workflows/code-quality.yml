name: Code Quality

on:
  push:
    branches:
      - main
      - v3
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SKELETONLABS_PLUS_REPOSITORIES_PAT }}
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          node-version: 24
          cache: true
      - run: vp fmt . --check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SKELETONLABS_PLUS_REPOSITORIES_PAT }}
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          node-version: 24
          cache: true
      - run: vp lint --type-aware
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SKELETONLABS_PLUS_REPOSITORIES_PAT }}
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          node-version: 24
          cache: true
      - run: vp run check
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SKELETONLABS_PLUS_REPOSITORIES_PAT }}
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          node-version: 24
          cache: true
      - run: vp exec playwright install chromium
      - run: vp test
